name: Build

# Manual only. Tags are the only thing that builds in this fork - see
# titanium-release.yml, which publishes the binary on esg/v* tags.
#
# This is upstream's CI and it does not pass here: the goreleaser before-hook runs
# `go test ./...`, and two upstream tests assert the key ordering that this fork
# deliberately inverted (sub-groups before leaf keys). Left dispatchable rather than
# deleted so the gosec and example-chart checks stay available on demand.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-exclude G304 ./...'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          args: release --snapshot --skip=sign

      - name: Verify chart diffs
        run: ./scripts/check-example-charts-diff

      - name: Cleanup
        if: always()
        run: rm -f ${HOME}/.docker/config.json
